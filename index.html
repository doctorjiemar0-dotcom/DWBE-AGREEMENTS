<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consignment Agreement</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #f9f9f9; color: #333; padding: 10px; text-align: center; }
        .agreement-card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { font-size: 1.1rem; color: #2e7d32; margin-bottom: 2px; }
        .subtitle { font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: 8px; }
        .img-container img { width: 100%; height: auto; border-radius: 4px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="agreement-card">
    <h1>Consignment Agreement</h1>
    <div class="subtitle" id="storeTitle">Kasunduan</div>
    
    <div class="img-container" id="agreementImgContainer">
        <!-- Dito lilitaw ang larawan ng kasunduan -->
    </div>
</div>

<script>
    // Listahan ng mga filename ng larawan sa iyong repository
    const storeAgreements = {
        "Marites Malijan": "1000023883.jpg",
        "DON DESUNIA": "1000023883.jpg",
        "Myla Dones": "myla.jpg",
        "Ria Quiz": "ria.jpg"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const storeParam = urlParams.get('store');
    
    const storeTitle = document.getElementById('storeTitle');
    const imgContainer = document.getElementById('agreementImgContainer');

    if (storeParam) {
        const cleanName = decodeURIComponent(storeParam).trim();
        storeTitle.textContent = "Kasunduan ni: " + cleanName;
        
        let imgFilename = storeAgreements[cleanName];

        if (!imgFilename) {
            // Kung wala sa listahan, gagawin nitong maliliit ang titik at papalitan ang espasyo ng underscore
            imgFilename = cleanName.toLowerCase().replace(/\s+/g, '_') + '.jpg';
        }

        // Tinitiyak natin na may kasamang ./ sa unahan para basahin ng GitHub Pages sa parehong folder
        const finalImagePath = "./path-to-image" ? imgFilename : imgFilename; 

        imgContainer.innerHTML = `
            <img src="${imgFilename}" alt="Consignment Agreement ni ${cleanName}" 
                 onerror="this.onerror=null; this.parentElement.innerHTML='<p style=\'font-size:0.8rem; color:#d32f2f; padding:10px;\'>Hindi makita ang larawan (<b>${imgFilename}</b>). Siguraduhing na-upload na ito sa DWBE-AGREEMENTS repository at eksaktong pareho ang spelling at extension (.jpg/.png).</p>';">
        `;
    } else {
        storeTitle.textContent = "General Agreement";
        imgContainer.innerHTML = `<p style="font-size: 0.85rem; color: #666;">Walang natukoy na tindahan sa link.</p>`;
    }
</script>

</body>
</html>
