<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consignment Agreement</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #f9f9f9; color: #333; padding: 15px; text-align: center; }
        .agreement-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { font-size: 1.1rem; color: #2e7d32; margin-bottom: 5px; }
        .subtitle { font-size: 0.9rem; font-weight: bold; color: #555; margin-bottom: 10px; }
        .img-container img { width: 100%; height: auto; border-radius: 4px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="agreement-card">
    <h1>Consignment Agreement</h1>
    <div class="subtitle" id="storeTitle">Kasunduan</div>
    
    <div class="img-container" id="agreementImgContainer">
        <!-- Dito lilitaw ang larawan ng kasunduan -->
    </div>
</div>

<script>
    // Dito nakalista ang mga larawan ng kasunduan ng bawat tindahan
    const storeAgreements = {
        "Marites Malijan": "1000023883.jpg", // Palitan o idagdag ang tamang filename ng larawan dito kung kinakailangan
        "DON DESUNIA": "1000023883.jpg"    // Halimbawa ng paglalagay ng litrato para sa iba pang kliyente
    };

    const urlParams = new URLSearchParams(window.location.search);
    const storeParam = urlParams.get('store');
    
    const storeTitle = document.getElementById('storeTitle');
    const imgContainer = document.getElementById('agreementImgContainer');

    if (storeParam) {
        const cleanName = decodeURIComponent(storeParam).trim();
        storeTitle.textContent = "Kasunduan ni: " + cleanName;
        
        // Hanapin ang larawan para sa tindahang ito, o gamitin ang default kung wala pa sa listahan
        let imgFilename = storeAgreements[cleanName] || "1000023883.jpg"; 

        imgContainer.innerHTML = `<img src="${imgFilename}" alt="Consignment Agreement ni ${cleanName}">`;
    } else {
        storeTitle.textContent = "General Agreement";
        imgContainer.innerHTML = `<p style="font-size: 0.85rem; color: #666;">Walang natukoy na tindahan sa link.</p>`;
    }
</script>

</body>
</html>
