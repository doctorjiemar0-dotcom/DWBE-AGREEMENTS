<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consignment Agreement</title>
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background: #f9f9f9; color: #333; padding: 15px; line-height: 1.6; }
        .agreement-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: auto; text-align: center; }
        h1 { font-size: 1.2rem; color: #2e7d32; margin-bottom: 5px; }
        .subtitle { font-size: 0.95rem; font-weight: bold; color: #555; margin-bottom: 15px; }
        .agreement-box { background: #f4f6f8; padding: 15px; border-radius: 6px; border: 1px solid #ddd; font-size: 0.85rem; text-align: left; margin-top: 10px; }
    </style>
</head>
<body>

<div class="agreement-card">
    <h1>Consignment Agreement</h1>
    <div class="subtitle" id="storeTitle">Kasunduan</div>
    
    <div class="agreement-box" id="agreementText">
        <p>Naglo-load ng kasunduan...</p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const storeParam = urlParams.get('store');
    
    const storeTitle = document.getElementById('storeTitle');
    const textContainer = document.getElementById('agreementText');

    if (storeParam) {
        const cleanName = decodeURIComponent(storeParam).trim();
        storeTitle.textContent = "Kasunduan ni: " + cleanName;
        
        // Dito mo ilalagay o ipapakita ang detalye o larawan ng kasunduan para sa partikular na tindahan
        textContainer.innerHTML = `
            <p><strong>Mga Tuntunin at Kundisyon ng Consignment:</strong></p>
            <p>1. Ang mga walis tambo ay ipinagkakatiwala sa <strong>${cleanName}</strong> para sa pagbebenta.</p>
            <p>2. Ang takdang remisa at inventory ay susundin ayon sa napagkasunduan.</p>
            <p>3. Ang anumang usapin sa stock at kita ay direktang iuulat sa admin.</p>
        `;
    } else {
        storeTitle.textContent = "General Agreement";
        textContainer.innerHTML = `<p>Walang nakasaad na pangalan ng tindahan sa link na ito.</p>`;
    }
</script>

</body>
</html>
